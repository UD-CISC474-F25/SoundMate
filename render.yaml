services:
  - type: web
    name: api
    env: node
    plan: free
    rootDir: .
    buildCommand: npm install && npx turbo build --filter=api
    startCommand: npm run start:prod --workspace=apps/api
    preDeployCommand: npx prisma migrate deploy --schema=./packages/database/prisma/schema.prisma
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false  # set in Dashboard or via render CLI
      - key: DIRECT_URL
        sync: false  # set in Dashboard or via render CLI